<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKEX Binary Gateway</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --brand-green: #00ed64;
    --brand-green-dark: #00b545;
    --brand-green-pressed: #008c34;
    --brand-green-soft: #c3f0d2;
    --brand-green-mid: #00a35c;
    --brand-teal-deep: #001e2b;
    --brand-teal: #003d4f;
    --brand-teal-mid: #00684a;
    --accent-purple: #7b3ff2;
    --accent-orange: #fa6e39;
    --accent-pink: #f06bb8;
    --accent-blue: #3d4f9f;
    --canvas: #ffffff;
    --canvas-dark: #001e2b;
    --surface: #f9fbfa;
    --surface-soft: #f4f7f6;
    --surface-feature: #e3fcef;
    --hairline: #e1e5e8;
    --hairline-soft: #eceff1;
    --hairline-strong: #c1ccd6;
    --hairline-dark: #1c2d38;
    --ink: #001e2b;
    --charcoal: #1c2d38;
    --slate: #3d4f5b;
    --steel: #5c6c7a;
    --stone: #7c8c9a;
    --muted: #a8b3bc;
    --on-dark: #ffffff;
    --on-dark-muted: #a8b3bc;
    --on-primary: #001e2b;
    --error: #fa6e39;
    --warning-bg: #fff8e0;
    --warning-text: #946f3f;
    --sidebar-bg: var(--surface);
    --log-bg: var(--canvas);
    --panel-header-bg: var(--canvas);
    --msg-bg: var(--canvas);
    --pill-radius: 9999px;
    --card-radius: 12px;
    --transition: 180ms ease;
    --shadow-subtle: rgba(0, 30, 43, 0.04) 0px 1px 2px 0px;
    --shadow-card: rgba(0, 30, 43, 0.08) 0px 4px 12px 0px;
    --shadow-modal: rgba(0, 30, 43, 0.16) 0px 16px 48px -8px;
  }

  .dark {
    --brand-green: #00ed64;
    --brand-green-dark: #00b545;
    --brand-green-pressed: #008c34;
    --brand-green-soft: #003d2a;
    --brand-green-mid: #00a35c;
    --brand-teal-deep: #001e2b;
    --brand-teal: #003d4f;
    --brand-teal-mid: #00684a;
    --canvas: #001e2b;
    --canvas-dark: #001e2b;
    --surface: #0a2a3a;
    --surface-soft: #0d2f40;
    --surface-feature: #003d2a;
    --hairline: #1c2d38;
    --hairline-soft: #1c2d38;
    --hairline-strong: #2a3f4f;
    --hairline-dark: #1c2d38;
    --ink: #ffffff;
    --charcoal: #e0e8ed;
    --slate: #a8b3bc;
    --steel: #7c8c9a;
    --stone: #5c6c7a;
    --muted: #5c6c7a;
    --on-dark: #ffffff;
    --on-dark-muted: #a8b3bc;
    --on-primary: #001e2b;
    --error: #fa6e39;
    --sidebar-bg: #001520;
    --log-bg: #001e2b;
    --panel-header-bg: #0a2a3a;
    --msg-bg: #001e2b;
    --shadow-subtle: rgba(0, 0, 0, 0.2) 0px 1px 2px 0px;
    --shadow-card: rgba(0, 0, 0, 0.3) 0px 4px 12px 0px;
    --shadow-modal: rgba(0, 0, 0, 0.4) 0px 16px 48px -8px;
  }

  html, body {
    height: 100%;
    font-family: 'Euclid Circular A', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--surface-soft);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== Title Bar ===== */
  .title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    padding: 0 32px;
    background: linear-gradient(135deg, #001e2b 0%, #003d4f 50%, #001e2b 100%);
    color: var(--on-dark);
    flex-shrink: 0;
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .title-bar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--brand-green), var(--brand-green-mid), var(--brand-green));
  }

  .title-bar::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 400px;
    height: 200%;
    background: radial-gradient(ellipse, rgba(0, 237, 100, 0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .title-bar-left {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .title-bar-logo {
    width: 36px;
    height: 36px;
    background: var(--brand-green);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 237, 100, 0.3);
  }

  .title-bar-logo svg {
    width: 20px;
    height: 20px;
    color: var(--on-primary);
  }

  .title-bar-title-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .title-bar h1 {
    font-family: 'Euclid Circular A', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin: 0;
  }

  .title-bar-subtitle {
    font-size: 11px;
    font-weight: 500;
    color: var(--on-dark-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .title-bar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .title-bar .nav-pills {
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.06);
    padding: 4px;
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .title-bar .nav-pill {
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--on-dark-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }

  .title-bar .nav-pill:hover {
    color: var(--on-dark);
    background: rgba(255, 255, 255, 0.08);
  }

  .title-bar .nav-pill.active {
    background: var(--brand-green);
    color: var(--on-primary);
  }

  .title-bar .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--on-dark-muted);
  }

  .title-bar .status-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 9999px;
    background: var(--muted);
    transition: background var(--transition);
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
  }

  .title-bar .status-badge .dot.connected {
    background: var(--brand-green);
    box-shadow: 0 0 6px rgba(0, 237, 100, 0.5);
  }

  .title-bar .status-badge .dot.error {
    background: var(--error);
    box-shadow: 0 0 6px rgba(250, 110, 57, 0.5);
  }

  .title-bar .status-badge.connected {
    border-color: rgba(0, 237, 100, 0.2);
    background: rgba(0, 237, 100, 0.08);
  }

  .title-bar .status-badge.connected .dot {
    background: var(--brand-green);
  }

  .title-bar .status-badge.connected span:last-child {
    color: var(--brand-green);
  }

  .title-bar .theme-toggle {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--on-dark-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }

  .title-bar .theme-toggle:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--on-dark);
    border-color: rgba(255, 255, 255, 0.15);
  }

  .title-bar .theme-toggle svg {
    width: 18px;
    height: 18px;
  }

  .title-bar .theme-toggle .theme-icon-dark {
    display: none;
  }

  .dark .title-bar .theme-toggle .theme-icon-light {
    display: none;
  }

  .dark .title-bar .theme-toggle .theme-icon-dark {
    display: flex;
  }

  /* ===== Body Row ===== */
  .body-row {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--hairline);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }

  .sidebar .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--steel);
    padding: 12px 16px 6px;
  }

  .sidebar-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 18px;
    border: none;
    border-radius: var(--pill-radius);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    cursor: pointer;
    transition: background var(--transition), color var(--transition), box-shadow var(--transition);
    text-align: left;
  }

  .sidebar-btn .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--steel);
    transition: color var(--transition);
  }

  .sidebar-btn .icon svg {
    width: 18px;
    height: 18px;
  }

  .sidebar-btn:hover {
    background: var(--surface);
  }

  .sidebar-btn:active {
    background: var(--hairline);
  }

  .sidebar-btn.primary-action {
    background: var(--brand-green);
    color: var(--on-primary);
    box-shadow: var(--shadow-subtle);
  }

  .sidebar-btn.primary-action .icon {
    color: var(--on-primary);
  }

  .sidebar-btn.primary-action:hover {
    background: var(--brand-green-dark);
  }

  .sidebar-btn.primary-action:active {
    background: var(--brand-green-pressed);
  }

  .sidebar-btn.danger-action {
    color: var(--error);
  }

  .sidebar-btn.danger-action .icon {
    color: var(--error);
  }

  .sidebar-btn.danger-action:hover {
    background: rgba(250, 110, 57, 0.08);
  }

  .sidebar-btn.business-action {
    position: relative;
    background: transparent;
    color: var(--ink);
    padding-left: 18px;
  }

  .sidebar-btn.business-action .icon {
    color: var(--brand-green-dark);
  }

  .sidebar-btn.business-action:hover {
    background: var(--surface-feature);
  }

  .sidebar-btn.business-action::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    border-radius: 9999px;
    background: var(--brand-green);
    opacity: 0;
    transition: opacity var(--transition);
  }

  .sidebar-btn.business-action:hover::before {
    opacity: 1;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--hairline);
    margin: 8px 12px;
    flex-shrink: 0;
  }

  /* ===== Main Content ===== */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    gap: 16px;
    overflow: hidden;
    min-width: 0;
  }

  /* ===== Log Panel ===== */
  .log-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--log-bg);
    border: 1px solid var(--hairline);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow-subtle);
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
    background: var(--panel-header-bg);
  }

  .panel-header .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .panel-header .panel-actions {
    display: flex;
    gap: 8px;
  }

  .panel-header .panel-actions button {
    padding: 6px 14px;
    border: 1px solid var(--hairline-strong);
    border-radius: var(--pill-radius);
    background: var(--canvas);
    color: var(--steel);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition), border-color var(--transition), color var(--transition);
  }

  .panel-header .panel-actions button:hover {
    background: var(--surface);
    border-color: var(--hairline-strong);
    color: var(--ink);
  }

  .log-content {
    flex: 1;
    padding: 12px 0;
    overflow-y: auto;
    font-family: 'Source Code Pro', 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
  }

  .log-content .log-entry {
    display: flex;
    gap: 12px;
    padding: 4px 20px;
    transition: background var(--transition);
  }

  .log-content .log-entry:hover {
    background: var(--surface);
  }

  .log-content .log-time {
    color: var(--muted);
    flex-shrink: 0;
    min-width: 72px;
  }

  .log-content .log-level {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    min-width: 42px;
  }

  .log-content .log-level.info {
    color: var(--brand-green-dark);
  }

  .log-content .log-level.warn {
    color: var(--accent-orange);
  }

  .log-content .log-level.error {
    color: var(--error);
  }

  .log-content .log-msg {
    color: var(--charcoal);
  }

  .log-content .placeholder {
    color: var(--muted);
    padding: 20px;
    font-style: italic;
  }

  /* ===== Request / Response Row ===== */
  .msg-row {
    display: flex;
    gap: 16px;
    height: 220px;
    flex-shrink: 0;
  }

  .msg-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--msg-bg);
    border: 1px solid var(--hairline);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow-subtle);
    overflow: hidden;
  }

  .msg-panel .panel-header .direction-tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: var(--pill-radius);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 8px;
  }

  .msg-panel .panel-header .direction-tag.out {
    background: var(--brand-green-soft);
    color: var(--brand-green-dark);
  }

  .msg-panel .panel-header .direction-tag.in {
    background: var(--surface-feature);
    color: var(--brand-green-mid);
  }

  .msg-content {
    flex: 1;
    padding: 12px 20px;
    overflow-y: auto;
    font-family: 'Source Code Pro', 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    color: var(--charcoal);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .msg-content .placeholder {
    color: var(--muted);
    font-style: italic;
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 30, 43, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 200ms ease, visibility 200ms ease;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow-modal);
    width: 90%;
    max-width: 640px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(16px);
    transition: transform 200ms ease;
  }

  .modal-overlay.active .modal {
    transform: translateY(0);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--panel-header-bg);
  }

  .modal-header h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border: 1px solid var(--hairline-strong);
    border-radius: var(--pill-radius);
    background: var(--canvas);
    color: var(--steel);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), color var(--transition);
  }

  .modal-close:hover {
    background: var(--surface);
    color: var(--ink);
  }

  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--hairline);
    background: var(--surface);
  }

  .modal-btn {
    padding: 10px 22px;
    border-radius: var(--pill-radius);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }

  .modal-btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--hairline-strong);
  }

  .modal-btn.secondary:hover {
    background: var(--surface);
  }

  .modal-btn.primary {
    background: var(--brand-green);
    color: var(--on-primary);
    border: none;
  }

  .modal-btn.primary:hover {
    background: var(--brand-green-dark);
  }

  .modal-btn.primary:active {
    background: var(--brand-green-pressed);
  }

  /* ===== Form ===== */
  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--slate);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    background: var(--canvas);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    height: 44px;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--brand-green-dark);
    border-width: 2px;
    padding: 9px 13px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* ===== Table ===== */
  .exec-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .exec-table th {
    text-align: left;
    padding: 10px 12px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--steel);
    border-bottom: 2px solid var(--hairline);
    background: var(--surface);
  }

  .exec-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--hairline-soft);
    color: var(--charcoal);
  }

  .exec-table tr:hover td {
    background: var(--surface);
  }

  .exec-table-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .sidebar {
      width: 56px;
      padding: 12px 8px;
    }

    .sidebar .section-label {
      display: none;
    }

    .sidebar-divider {
      display: none;
    }

    .sidebar-btn .label {
      display: none;
    }

    .sidebar-btn {
      justify-content: center;
      padding: 10px;
    }

    .msg-row {
      flex-direction: column;
      height: auto;
    }

    .msg-panel {
      min-height: 120px;
    }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Title Bar -->
  <header class="title-bar">
    <div class="title-bar-left">
      <div class="title-bar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </div>
      <div class="title-bar-title-group">
        <h1>HKEX Binary Gateway</h1>
        <span class="title-bar-subtitle">FIX Protocol Interface</span>
      </div>
    </div>
    <div class="title-bar-right">
      <div class="nav-pills">
        <button class="nav-pill active">Gateway</button>
        <button class="nav-pill">Monitor</button>
        <button class="nav-pill">Config</button>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon-light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </span>
        <span class="theme-icon-dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </span>
      </button>
      <div class="status-badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="body-row">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="section-label">基础功能</div>

      <button class="sidebar-btn primary-action" data-action="connect">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
        <span class="label">Connect TCP</span>
      </button>

      <button class="sidebar-btn" data-action="lookup">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
        </span>
        <span class="label">Lookup IPs</span>
      </button>

      <button class="sidebar-btn" data-action="logon">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </span>
        <span class="label">Logon</span>
      </button>

      <button class="sidebar-btn danger-action" data-action="logout">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </span>
        <span class="label">Logout</span>
      </button>

      <button class="sidebar-btn" data-action="send-test">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </span>
        <span class="label">Send Test</span>
      </button>

      <div class="sidebar-divider"></div>

      <div class="section-label">业务功能</div>

      <button class="sidebar-btn business-action" data-action="send-order">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </span>
        <span class="label">Send New Order</span>
      </button>

      <button class="sidebar-btn business-action" data-action="exec-report">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </span>
        <span class="label">Execution Report</span>
      </button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Log Panel -->
      <section class="log-panel">
        <div class="panel-header">
          <span class="panel-title">Log Messages</span>
          <div class="panel-actions">
            <button id="clearLogBtn">Clear</button>
          </div>
        </div>
        <div class="log-content" id="logContent"></div>
      </section>

      <!-- Request / Response Row -->
      <div class="msg-row">
        <section class="msg-panel">
          <div class="panel-header">
            <span class="panel-title">
              Request
              <span class="direction-tag out">Out</span>
            </span>
          </div>
          <div class="msg-content" id="requestContent">
            <span class="placeholder">No request sent yet.</span>
          </div>
        </section>

        <section class="msg-panel">
          <div class="panel-header">
            <span class="panel-title">
              Response
              <span class="direction-tag in">In</span>
            </span>
          </div>
          <div class="msg-content" id="responseContent">
            <span class="placeholder">No response received yet.</span>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<!-- New Order Modal -->
<div class="modal-overlay" id="newOrderModal">
  <div class="modal">
    <div class="modal-header">
      <h2>MSG TYPE 11 — New Order</h2>
      <button class="modal-close" onclick="closeModal('newOrderModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>ClOrdID</label>
          <input type="text" id="orderClOrdID" placeholder="Client Order ID">
        </div>
        <div class="form-group">
          <label>Symbol</label>
          <input type="text" id="orderSymbol" placeholder="e.g. 0700">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Side</label>
          <select id="orderSide">
            <option value="1">1 — Buy</option>
            <option value="2">2 — Sell</option>
          </select>
        </div>
        <div class="form-group">
          <label>OrderQty</label>
          <input type="number" id="orderQty" placeholder="Quantity">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>OrdType</label>
          <select id="orderType">
            <option value="1">1 — Market</option>
            <option value="2">2 — Limit</option>
          </select>
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="number" id="orderPrice" placeholder="Limit price" step="0.01">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>TimeInForce</label>
          <select id="orderTIF">
            <option value="0">0 — Day</option>
            <option value="3">3 — IOC</option>
            <option value="4">4 — FOK</option>
          </select>
        </div>
        <div class="form-group">
          <label>Account</label>
          <input type="text" id="orderAccount" placeholder="Account">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn secondary" onclick="closeModal('newOrderModal')">Cancel</button>
      <button class="modal-btn primary" onclick="submitNewOrder()">Send Order</button>
    </div>
  </div>
</div>

<!-- Execution Report Modal -->
<div class="modal-overlay" id="execReportModal">
  <div class="modal">
    <div class="modal-header">
      <h2>MSG TYPE 10 — Execution Report</h2>
      <button class="modal-close" onclick="closeModal('execReportModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Filter by ClOrdID (optional)</label>
        <input type="text" id="execFilterClOrdID" placeholder="Leave empty to show all">
      </div>
      <div id="execTableContainer">
        <table class="exec-table">
          <thead>
            <tr>
              <th>ClOrdID</th>
              <th>Symbol</th>
              <th>Side</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="execTableBody">
          </tbody>
        </table>
        <div class="exec-table-empty" id="execTableEmpty">No execution reports found.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn secondary" onclick="closeModal('execReportModal')">Close</button>
    </div>
  </div>
</div>

<script>
const logContent = document.getElementById('logContent');
const requestContent = document.getElementById('requestContent');
const responseContent = document.getElementById('responseContent');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const sidebar = document.getElementById('sidebar');

let isConnected = false;

function addLog(level, msg) {
  const now = new Date();
  const time = now.toTimeString().split(' ')[0];
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-time">${time}</span><span class="log-level ${level}">${level.toUpperCase()}</span><span class="log-msg">${msg}</span>`;
  logContent.appendChild(entry);
  logContent.scrollTop = logContent.scrollHeight;
}

const statusBadge = statusDot.parentElement;

function setConnected(state) {
  isConnected = state;
  if (state) {
    statusDot.classList.add('connected');
    statusDot.classList.remove('error');
    statusBadge.classList.add('connected');
    statusText.textContent = 'Connected';
  } else {
    statusDot.classList.remove('connected');
    statusBadge.classList.remove('connected');
    statusText.textContent = 'Disconnected';
  }
}

function setError(msg) {
  statusDot.classList.add('error');
  statusDot.classList.remove('connected');
  statusText.textContent = msg || 'Error';
}

sidebar.addEventListener('click', function(e) {
  const btn = e.target.closest('.sidebar-btn');
  if (!btn) return;
  const action = btn.dataset.action;

  switch(action) {
    case 'connect':
      addLog('info', 'Connecting TCP...');
      setTimeout(() => {
        setConnected(true);
        addLog('info', 'TCP connection established.');
      }, 800);
      break;
    case 'lookup':
      addLog('info', 'Resolving HKEX gateway IPs...');
      setTimeout(() => {
        addLog('info', 'Resolved: 10.0.1.100, 10.0.1.101');
      }, 600);
      break;
    case 'logon':
      if (!isConnected) {
        addLog('warn', 'Not connected. Please connect first.');
        return;
      }
      addLog('info', 'Sending logon request...');
      requestContent.innerHTML = '<span class="log-msg">35=A\nMsgType=Logon\nHeartBtInt=30\n</span>';
      setTimeout(() => {
        responseContent.innerHTML = '<span class="log-msg">35=A\nMsgType=LogonAck\nStatus=OK\n</span>';
        addLog('info', 'Logon successful.');
      }, 500);
      break;
    case 'logout':
      addLog('info', 'Sending logout request...');
      requestContent.innerHTML = '<span class="log-msg">35=5\nMsgType=Logout\n</span>';
      setTimeout(() => {
        responseContent.innerHTML = '<span class="log-msg">35=5\nMsgType=LogoutAck\n</span>';
        setConnected(false);
        addLog('info', 'Logged out.');
      }, 400);
      break;
    case 'send-test':
      if (!isConnected) {
        addLog('warn', 'Not connected. Please connect first.');
        return;
      }
      addLog('info', 'Sending test message...');
      requestContent.innerHTML = '<span class="log-msg">35=1\nMsgType=TestRequest\nTestReqID=TEST-001\n</span>';
      setTimeout(() => {
        responseContent.innerHTML = '<span class="log-msg">35=0\nMsgType=Heartbeat\n</span>';
        addLog('info', 'Test response received.');
      }, 300);
      break;
    case 'send-order':
      document.getElementById('newOrderModal').classList.add('active');
      break;
    case 'exec-report':
      document.getElementById('execReportModal').classList.add('active');
      loadExecReports();
      break;
  }
});

document.getElementById('clearLogBtn').addEventListener('click', function() {
  logContent.innerHTML = '';
  addLog('info', 'Log cleared.');
});

document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      overlay.classList.remove('active');
    }
  });
});

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function submitNewOrder() {
  const clOrdID = document.getElementById('orderClOrdID').value || 'ORD-' + Date.now();
  const symbol = document.getElementById('orderSymbol').value;
  const side = document.getElementById('orderSide').value;
  const qty = document.getElementById('orderQty').value;
  const ordType = document.getElementById('orderType').value;
  const price = document.getElementById('orderPrice').value;
  const tif = document.getElementById('orderTIF').value;
  const account = document.getElementById('orderAccount').value;

  if (!symbol || !qty) {
    addLog('warn', 'Symbol and OrderQty are required.');
    return;
  }

  closeModal('newOrderModal');

  const reqBody = `35=D\nMsgType=NewOrderSingle\nClOrdID=${clOrdID}\nSymbol=${symbol}\nSide=${side}\nOrderQty=${qty}\nOrdType=${ordType}${price ? '\nPrice=' + price : ''}\nTimeInForce=${tif}${account ? '\nAccount=' + account : ''}`;
  requestContent.innerHTML = `<span class="log-msg">${reqBody}</span>`;
  addLog('info', `New Order sent: ${symbol} ${side === '1' ? 'BUY' : 'SELL'} ${qty}`);

  setTimeout(() => {
    const respBody = `35=8\nMsgType=ExecutionReport\nClOrdID=${clOrdID}\nSymbol=${symbol}\nExecType=0\nOrdStatus=0\nCumQty=0\nLeavesQty=${qty}`;
    responseContent.innerHTML = `<span class="log-msg">${respBody}</span>`;
    addLog('info', `Execution report received for ${clOrdID}.`);
  }, 600);
}

const sampleExecReports = [
  { clOrdID: 'ORD-1001', symbol: '0700', side: '1', qty: 100, price: '320.50', status: 'Filled' },
  { clOrdID: 'ORD-1002', symbol: '9988', side: '2', qty: 200, price: '85.20', status: 'Partial' },
  { clOrdID: 'ORD-1003', symbol: '0941', side: '1', qty: 50, price: '168.00', status: 'New' },
];

function loadExecReports() {
  const filter = document.getElementById('execFilterClOrdID').value.trim().toUpperCase();
  const tbody = document.getElementById('execTableBody');
  const emptyMsg = document.getElementById('execTableEmpty');
  tbody.innerHTML = '';

  const filtered = filter ? sampleExecReports.filter(r => r.clOrdID.toUpperCase().includes(filter)) : sampleExecReports;

  if (filtered.length === 0) {
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    filtered.forEach(function(r) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.clOrdID}</td><td>${r.symbol}</td><td>${r.side === '1' ? 'Buy' : 'Sell'}</td><td>${r.qty}</td><td>${r.price}</td><td>${r.status}</td>`;
      tbody.appendChild(tr);
    });
  }
}

// ===== Theme Toggle =====
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('hkex-gateway-theme');

function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
  localStorage.setItem('hkex-gateway-theme', theme);
}

if (savedTheme) {
  applyTheme(savedTheme);
} else {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (prefersDark) applyTheme('dark');
}

themeToggle.addEventListener('click', function() {
  const isDark = document.documentElement.classList.contains('dark');
  applyTheme(isDark ? 'light' : 'dark');
});

// ===== Init =====
addLog('info', 'HKEX Binary Gateway initialized.');
</script>

</body>
</html>
